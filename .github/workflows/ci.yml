name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint
        run: ruff check .

      # The model self-checks are asserts inside the modules they guard, so
      # they run as scripts rather than through pytest. They are cheap and
      # they fail loudly if a calibration constant drifts.
      - name: Model self-checks
        run: |
          python -m pacific_wings.simulation.revenue
          python -m pacific_wings.simulation.cost
          python -m pacific_wings.simulation.market_share
          python -m pacific_wings.simulation.fleet
          python -m pacific_wings.ml.confidence
          python -m pacific_wings.analysis.open_route

      - name: Tests
        run: pytest tests/ -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
